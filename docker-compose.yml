services:
  documents:
    build: .
    init: true
    stop_grace_period: 30s
    networks:
      - pdf-network
    environment:
      PORT: ${PORT:-8000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-pdf_extractext}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-1500}
      MONGODB_POOL_SIZE: ${MONGODB_POOL_SIZE:-16}
      MONGODB_WAIT_QUEUE_MS: ${MONGODB_WAIT_QUEUE_MS:-200}
      DOCUMENTS_MAX_IN_FLIGHT: ${DOCUMENTS_MAX_IN_FLIGHT:-16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/health/ready', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: pdf-network
      traefik.http.routers.documents.rule: Host(`${TRAEFIK_DOCUMENTS_HOST:-documents.universidad.localhost}`)
      traefik.http.routers.documents.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      traefik.http.routers.documents.service: documents
      traefik.http.routers.documents.middlewares: documents-retry
      traefik.http.middlewares.documents-retry.retry.attempts: '3'
      traefik.http.middlewares.documents-retry.retry.initialinterval: 100ms
      traefik.http.services.documents.loadbalancer.server.port: ${PORT:-8000}
      traefik.http.services.documents.loadbalancer.healthcheck.path: /health/ready
      traefik.http.services.documents.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.documents.loadbalancer.healthcheck.timeout: 2s

  mongodb:
    image: mongo:7.0
    init: true
    stop_grace_period: 30s
    networks:
      - pdf-network
    volumes:
      - mongo7_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    labels:
      traefik.enable: 'false'

volumes:
  mongo7_data:

networks:
  pdf-network:
    external: true
