global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: documents
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/documents_api_token
    dns_sd_configs:
      - names: [documents]
        type: A
        port: 8000
