name: Validate Document Service
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install uv==0.13.7 pip-audit==2.10.1
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Unit and MongoDB integration tests
        run: uv run --locked pytest -q
      - name: Check exported production dependencies
        run: |
          uv export --locked --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --no-deps --disable-pip
      - name: Build production image
        run: docker build -t documents:ci .
      - name: Verify runtime privileges and packages
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true documents:ci python -c "import os, importlib.util; assert os.getuid() != 0; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('pip') is None; import app.main"
      - name: HTTP smoke test and MongoDB outage recovery
        run: python scripts/validate_container.py --image documents:ci
      - name: Isolated persistence load smoke test
        run: |
          docker pull grafana/k6@sha256:3e4186aea62e11a45560bfc51e19eeafe82fc07ce069c78aff44b7ff893d9a5e
          python scripts/load_isolated.py --image documents:ci
      - name: Preserve load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documents-load
          path: .integration/load/
          if-no-files-found: ignore
      - name: Scan image for fixable high and critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --parallel 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 documents:ci
